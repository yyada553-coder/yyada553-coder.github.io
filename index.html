<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleshflow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="draw-surface" aria-label="Generative drawing surface"></canvas>

    <aside class="controls" aria-label="Brush and background controls">
      <h1>FLESHFLOW</h1>
      <p>Drag to carve cuts that sag and drip.</p>

      <label for="bg-color">Background</label>
      <input id="bg-color" type="color" value="#050505" />

      <label for="ink-color">Ink</label>
      <input id="ink-color" type="color" value="#f2f2f2" />

      <label for="density">Cut Weight</label>
      <input id="density" type="range" min="2" max="14" value="7" />

      <button id="clear" type="button">Clear Canvas</button>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
